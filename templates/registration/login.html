{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم - مدیریت باشگاه</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container login-container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="avatar-placeholder mb-3">
                                <i class="fas fa-dumbbell fa-4x text-danger"></i>
                            </div>
                            <h3 class="fw-bold">مدیریت باشگاه</h3>
                            <p class="text-muted">ورود به پنل مدیریت</p>
                        </div>
                        <form method="post">
                            {% csrf_token %}
                            {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
                            <input type="hidden" name="next" value="{{ next }}">
                            <div class="mb-3">
                                <label for="username" class="form-label">نام کاربری / شماره موبایل</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" id="id_username" name="username" value="{{ form.username.value|default:'' }}" placeholder="نام کاربری خود را وارد کنید" required autofocus>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">رمز عبور</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="id_password" name="password" placeholder="رمز عبور خود را وارد کنید" required>
                                </div>
                            </div>
                            <div class="mb-3 d-flex justify-content-between align-items-center">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label" for="remember">مرا به خاطر بسپار</label>
                                </div>
                                {% for error in form.username.errors %}<span class="text-danger small">{{ error }}</span>{% endfor %}
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">ورود</button>
                        </form>
                        <div class="text-center mt-3">
                            <p class="text-muted small">نسخه 1.0.0</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
