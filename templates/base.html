<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت باشگاه</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'dashboard' %}">
                <i class="fas fa-dumbbell"></i> مدیریت باشگاه
            </a>
            <div class="d-flex align-items-center">
                <span class="text-light me-3">
                    <i class="fas fa-user"></i> مدیر سیستم
                </span>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link text-white" href="{% url 'dashboard' %}"><i
                                    class="fas fa-tachometer-alt"></i> داشبورد</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="{% url 'member_list' %}"><i
                                    class="fas fa-users"></i> اعضا</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="{% url 'class_list' %}"><i
                                    class="fas fa-chalkboard-teacher"></i> کلاس‌ها</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="{% url 'attendance' %}"><i
                                    class="fas fa-clipboard-check"></i> حضور و غیاب</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="{% url 'subscription_list' %}"><i
                                    class="fas fa-ticket-alt"></i> اشتراک‌ها</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="{% url 'payment_list' %}"><i
                                    class="fas fa-credit-card"></i> پرداخت‌ها</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="{% url 'finance_dashboard' %}"><i
                                    class="fas fa-chart-line"></i> امور مالی</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="{% url 'expense_list' %}"><i
                                    class="fas fa-receipt"></i> هزینه‌ها</a></li>
                        <li class="nav-item"><a class="nav-link text-white"
                                href="{% url 'notification_list' %}"><i class="fas fa-bell"></i> پیامک‌ها</a>
                        </li>
                        <li class="nav-item"><a class="nav-link text-white" href="{% url 'gym_settings' %}"><i
                                    class="fas fa-cog"></i> تنظیمات باشگاه</a></li>
                        <li class="nav-item"><a class="nav-link text-white" href="{% url 'profile' %}"><i
                                    class="fas fa-user-circle"></i> پروفایل</a></li>
                        <li class="nav-item"><a class="nav-link text-danger" href="{% url 'login' %}"><i
                                    class="fas fa-sign-out-alt"></i> خروج</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="messages mt-3">
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        خوش آمدید! سیستم با موفقیت بارگذاری شد.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                </div>

                <div id="page-content"></div>

                <footer class="footer mt-auto py-3 bg-light">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-md-6 text-md-end">
                                <span class="text-muted">© ۱۴۰۳ مدیریت باشگاه - تمام حقوق محفوظ است</span>
                            </div>
                            <div class="col-md-6 text-md-start">
                                <span class="text-muted">نسخه 1.0.0</span>
                            </div>
                        </div>
                    </div>
                </footer>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>

</html>
