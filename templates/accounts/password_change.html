{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تغییر گذرواژه</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-4" style="max-width: 600px">
        <h1 class="h3 mb-4">تغییر گذرواژه</h1>
        <form method="post" class="card card-body shadow-sm">
            {% csrf_token %}
            {% for field in form %}<div class="mb-3">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}
            {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
            <div class="d-flex gap-2"><button class="btn btn-warning" type="submit">تغییر گذرواژه</button><a class="btn btn-secondary" href="{% url 'profile' %}">بازگشت</a></div>
        </form>
    </main>
</body>
</html>
